name: Check new links

on:
  pull_request:
    paths:
      - "content/**"
      - "links/**"
      - "tools/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  new-links:
    runs-on: ubuntu-latest
    # the checker stops starting requests after 15 minutes; this is the backstop
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements/requirements.txt
      - name: Links on the base branch
        # via env, so the branch name is data to bash, never part of the script
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git show "origin/$BASE_REF:links/links.csv" > "$RUNNER_TEMP/base-links.csv" || echo "url,domain,first_seen" > "$RUNNER_TEMP/base-links.csv"
      - name: Check new links only
        run: python -m tools.check_links --new-against "$RUNNER_TEMP/base-links.csv" --report "$RUNNER_TEMP/report.md"
      - name: Comment on the pull request
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s "$RUNNER_TEMP/report.md" ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/report.md" --edit-last --create-if-none
          fi
