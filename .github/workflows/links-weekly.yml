name: Check links weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    # the checker stops starting requests after 15 minutes; this is the backstop
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements/requirements.txt
      - name: Check the next batch of links
        run: make check-links

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add links/status.csv links/report.md
          if git diff --cached --quiet; then
            echo "No changes to save"
            exit 0
          fi
          git commit -m "Update link check results"
          # if main is protected, open a pull request instead
          if ! git push origin HEAD:main; then
            branch="link-status-$(date +%F)"
            git push origin "HEAD:refs/heads/$branch"
            gh pr create --base main --head "$branch" \
              --title "Update link check results" \
              --body "Weekly outbound link check results."
          fi

      - name: Update the report issue
        run: |
          title="Outbound link report"
          label="link-report"
          # only an issue this workflow created: anyone can open one with the same title
          number=$(gh issue list --state open --author app/github-actions --label "$label" \
            --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -s links/report.md ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file links/report.md
            else
              gh label create "$label" --description "Weekly outbound link report" --force
              gh issue create --title "$title" --label "$label" --body-file links/report.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "No problems found."
          fi
