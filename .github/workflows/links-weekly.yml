name: Check links weekly

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/requirements.txt
      - name: Check the next batch of links
        run: make check-links

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add links/status.csv
          if git diff --cached --quiet; then
            echo "No changes to save"
            exit 0
          fi
          git commit -m "Update link check results"
          # if main is protected, open a pull request instead
          if ! git push origin HEAD:main; then
            branch="link-status-$(date +%F)"
            git push origin "HEAD:refs/heads/$branch"
            gh pr create --base main --head "$branch" \
              --title "Update link check results" \
              --body "Weekly outbound link check results."
          fi

      - name: Update the report issue
        run: |
          title="Outbound link report"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -s links/report.md ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file links/report.md
            else
              gh issue create --title "$title" --body-file links/report.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "No problems found."
          fi
