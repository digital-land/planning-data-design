name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        description: The environment to deploy to.
        required: true
        default: development
        options:
          - development
          - staging
          - production

jobs:
  detect-environments:
    runs-on: ubuntu-latest
    permissions:
      actions: read # list environments; nothing else, whatever the repo default
    outputs:
      environments: ${{ steps.environments.outputs.result }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: environments
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: json
          script: |
            const allowed = ['development', 'staging', 'production'];

            // a manual run deploys to exactly one environment, never all of them
            if (context.eventName === 'workflow_dispatch') {
              const env = context.payload?.inputs?.environment || 'development';
              return allowed.includes(env) ? [env] : [];
            }

            // a push to main deploys to every allowed environment
            const { data: { environments } } = await github.rest.repos.getAllEnvironments({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            return environments.map(e => e.name).filter(name => allowed.includes(name));

  deploy:
    runs-on: ubuntu-latest
    needs: [detect-environments]
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        environment: ${{ fromJSON(needs.detect-environments.outputs.environments) }}
    environment: ${{ matrix.environment }}
    env:
      DOCKER_REPO: ${{ secrets.DEPLOY_DOCKER_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the image tag, as an environment variable so scripts never inline ${{ }}
      - run: echo "TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
          unzip -q awscliv2.zip
          sudo ./aws/install --update
          sudo apt-get update
          sudo apt-get install -y rsync

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.DEPLOY_AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - run: docker build --build-arg DEPLOY_TIME="$(date +%Y-%m-%dT%H:%M:%S)" -t "$DOCKER_REPO:$TAG" .

      - run: docker tag "$DOCKER_REPO:$TAG" "$DOCKER_REPO:main"

      - run: docker push "$DOCKER_REPO:$TAG"

      - run: docker push "$DOCKER_REPO:main"
