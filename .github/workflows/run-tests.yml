name: Run tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements/requirements.txt -r requirements/dev-requirements.txt
      - run: make black-check
      - run: make flake8
      - run: make bandit
      - run: make audit
      - run: make check-content
      - run: make test
